# Render Blueprint — https://render.com/docs/blueprint-spec
#
# ─────────────────────────────────────────────────────────────
#  THIS IS A DEMO DEPLOY. BOOKINGS ARE NOT KEPT.
#
#  Free Render instances have an ephemeral filesystem and cannot attach a
#  persistent disk, so the SQLite database is wiped on every deploy — and
#  again whenever the instance restarts after spinning down. Free services
#  spin down after 15 minutes without traffic.
#
#  Fine for showing the site to family. Do not send real clients here.
#
#  To make it real, switch to a paid instance and attach a disk:
#
#    plan: starter
#    disk:
#      name: jc-beauty-data
#      mountPath: /var/data
#      sizeGB: 1
#    envVars:
#      - key: DATABASE_PATH
#        value: /var/data/jcbeauty.db
#
#  Nothing else needs to change — the app already reads DATABASE_PATH.
# ─────────────────────────────────────────────────────────────

services:
  - type: web
    name: jc-beauty
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /

    envVars:
      - key: NODE_VERSION
        value: "22"

      # Set this yourself in the Render dashboard — never stored in git.
      - key: ADMIN_PASSWORD
        sync: false

      # Render generates a random value on first deploy. Changing it later
      # signs everyone out of /admin.
      - key: ADMIN_SECRET
        generateValue: true
